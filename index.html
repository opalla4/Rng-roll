<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Game - Username Auth & Manual Attack</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg: #0d0e12; --card: #16181e; --accent: #6c5ce7; --gold: #f1c40f; --gem: #00cec9; }
        body { background: var(--bg); color: #fff; font-family: system-ui, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; user-select: none; }
        .stats-bar { display: flex; gap: 10px; background: var(--card); padding: 8px 15px; border-radius: 8px; border: 1px solid #2a2d37; font-size: 12px; flex-wrap: wrap; margin-bottom: 10px; }
        .main { display: flex; gap: 10px; max-width: 900px; width: 100%; flex-wrap: wrap; }
        .panel { background: var(--card); border: 1px solid #2a2d37; border-radius: 12px; padding: 12px; flex: 1; min-width: 290px; text-align: center; }
        .item-display { font-size: 18px; font-weight: bold; margin: 5px 0; min-height: 25px; }
        .controls { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
        button { background: var(--accent); color: #fff; border: none; padding: 6px 10px; font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:active { transform: scale(0.95); }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-gem { background: var(--gem); color: #000; }
        .btn-danger { background: #e74c3c; }
        .btn-attack { background: #ff4757; color: #fff; font-size: 14px; padding: 8px 16px; border: 2px solid #ff6b81; }
        .btn-nav { background: #34495e; padding: 2px 8px; font-size: 12px; }
        #canvas { background: radial-gradient(circle, #1a1c23 0%, #050508 100%); border: 1px solid #333; border-radius: 8px; width: 100%; height: 220px; }
        .inv { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; font-size: 11px; margin-top: 5px; }
        .inv-item { display: flex; justify-content: space-between; background: #0d0e12; padding: 3px 6px; border-radius: 4px; }
        .auto-selector { font-size: 10px; display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 4px; }
        #saveStatus { font-size: 10px; color: #2ecc71; margin-top: 4px; }
        
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--accent); text-align: center; width: 280px; }
        .login-box input { width: 90%; padding: 8px; margin: 6px 0; border-radius: 6px; border: 1px solid #333; background: #0d0e12; color: #fff; text-align: center; }
        .login-box button { width: 100%; padding: 8px; margin-top: 6px; }
    </style>
</head>
<body>

    <!-- واجهة الدخول باسم المستخدم فقط -->
    <div id="loginOverlay">
        <div class="login-box">
            <h3 style="margin: 0 0 10px 0; color: var(--gold);">🎮 Player Login</h3>
            <input type="text" id="accUser" placeholder="Username (اسم المستخدم)">
            <input type="password" id="accPass" placeholder="Password (كلمة المرور)">
            <button class="btn-gold" onclick="login()">Login</button>
            <button class="btn-gem" onclick="register()">Create Account</button>
            <div id="authMsg" style="font-size: 10px; color: #e74c3c; margin-top: 8px;"></div>
        </div>
    </div>

    <!-- شريط الإحصائيات -->
    <div class="stats-bar">
        <div>Rolls: <span id="rolls">0</span></div>
        <div>Coins 💰: <span id="coins" style="color:var(--gold)">100</span></div>
        <div>Gems 💎: <span id="gems" style="color:var(--gem)">0</span></div>
        <div>Luck 🍀: <span id="luck">0.1x</span></div>
        <div>Power ⚔️: <span id="pwr">10</span></div>
    </div>

    <div class="main">
        <div class="panel">
            <div id="itemName" class="item-display" style="color: #a6a6a6;">Open a Pack!</div>
            <div id="itemChance" style="font-size: 11px; color: #8a8d9b;">Weapon: 💰 100 | Pet: 💰 500</div>
            <div class="controls">
                <button class="btn-gold" onclick="openPack('weapon')">Weapon Pack (💰100)</button>
                <button class="btn-gold" onclick="openPack('pet')">Pet Pack (💰500)</button>
                <button class="btn-gem" onclick="buyLuck()">Upgrade Luck (💎<span id="luckCost">2</span>)</button>
                <button id="autoPackBtn" class="btn-danger" onclick="toggleAutoPack()">AUTO PACK</button>
            </div>
            
            <div class="auto-selector">
                <span>AUTO Pack:</span>
                <label><input type="radio" name="autoType" value="weapon" checked onchange="autoType=this.value"> Weapon</label>
                <label><input type="radio" name="autoType" value="pet" onchange="autoType=this.value"> Pet</label>
            </div>

            <div id="saveStatus">Cloud Save: Logged Out 🔒</div>

            <div style="text-align: left; margin-top: 8px;">
                <b style="font-size: 11px;">Inventory:</b>
                <div class="inv" id="invList"></div>
            </div>
        </div>

        <div class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:bold; margin-bottom:4px;">
                <span>Battlefield ⚔️</span>
                <div>
                    <button class="btn-nav" onclick="changeWave(-1)">&lt;</button>
                    <span style="color:#e74c3c; margin: 0 4px;">Wave: <span id="wave">1</span></span>
                    <button class="btn-nav" onclick="changeWave(1)">&gt;</button>
                </div>
            </div>
            
            <canvas id="canvas" width="340" height="220"></canvas>
            
            <div style="display: flex; gap: 8px; justify-content: center; margin-top: 6px;">
                <button class="btn-attack" onclick="manualAttack()">⚔️ ATTACK!</button>
                <button id="autoFightBtn" style="background: #2ed573; color: #000;" onclick="toggleAutoFight()">Auto Attack: ON</button>
            </div>

            <div style="margin-top: 8px; border-top: 1px solid #2a2d37; padding-top: 6px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <span style="font-size: 11px; font-weight: bold; color: var(--gold);">🏆 Leaderboard</span>
                    <button style="font-size: 9px; padding: 2px 5px;" onclick="logout()">Logout</button>
                </div>
                <div id="leaderboardList" style="font-size: 10px; max-height: 80px; overflow-y: auto; text-align: left; display: flex; flex-direction: column; gap: 3px;">
                    <div style="color: #8a8d9b;">Loading...</div>
                </div>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://vvfrdoykirlscgjxukos.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2ZnJkb3lraXJsc2Nnanh1a29zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MDg2MjAsImV4cCI6MjEwMzE4NDYyMH0.Rq5qiK0ByvmybeQFfdJ_Hx_JJ5aL8N_HWxJwg_HiAak';

    let supabaseClient = null, currentUser = null, currentUsername = "";

    function initSupabase() {
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                checkSession();
                setupRealtime();
            }
        } catch(e) { console.error(e); }
    }

    // تحويل اسم المستخدم داخلياً إلى صيغة يتقبلها Supabase Auth بدون علم المستخدم
    function userToEmail(user) {
        return user.toLowerCase().replace(/[^a-z0-9]/g, '') + "@game.internal";
    }

    async function login() {
        let username = document.getElementById('accUser').value.trim();
        let password = document.getElementById('accPass').value.trim();
        let msg = document.getElementById('authMsg');
        
        if (!username || !password) { 
            msg.innerText = "أدخل اسم المستخدم وكلمة المرور!"; 
            return; 
        }

        msg.style.color = "#f1c40f"; 
        msg.innerText = "جاري تسجيل الدخول...";
        
        const email = userToEmail(username);
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            msg.style.color = "#e74c3c"; 
            msg.innerText = error.message.includes("Invalid login credentials") ? "اسم المستخدم أو كلمة المرور خاطئة" : error.message;
        } else {
            currentUser = data.user;
            currentUsername = username;
            document.getElementById('loginOverlay').style.display = 'none';
            await loadUserData();
        }
    }

    async function register() {
        let username = document.getElementById('accUser').value.trim();
        let password = document.getElementById('accPass').value.trim();
        let msg = document.getElementById('authMsg');
        
        if (!username || !password) { 
            msg.innerText = "أدخل اسم المستخدم وكلمة المرور!"; 
            return; 
        }

        if (password.length < 6) {
            msg.innerText = "كلمة المرور يجب أن تكون 6 خانات على الأقل";
            return;
        }

        msg.style.color = "#f1c40f"; 
        msg.innerText = "جاري إنشاء الحساب...";
        
        const email = userToEmail(username);
        const { data, error } = await supabaseClient.auth.signUp({ 
            email, 
            password,
            options: { data: { username: username } }
        });

        if (error) {
            msg.style.color = "#e74c3c"; 
            msg.innerText = error.message;
        } else if (data.user) {
            currentUser = data.user;
            currentUsername = username;
            document.getElementById('loginOverlay').style.display = 'none';
            saveGame();
        }
    }

    async function checkSession() {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session) {
            currentUser = data.session.user;
            document.getElementById('loginOverlay').style.display = 'none';
            await loadUserData();
        }
    }

    async function logout() {
        if (supabaseClient) await supabaseClient.auth.signOut();
        location.reload();
    }

    async function loadUserData() {
        if (!currentUser || !supabaseClient) return;
        const { data } = await supabaseClient.from('leaderboard').select('*').eq('user_id', currentUser.id).single();
        if (data) {
            if (data.username) currentUsername = data.username;
            if (data.save_data) applySaveData(JSON.parse(data.save_data));
        }
        document.getElementById('saveStatus').innerText = "Logged in: " + currentUsername + " ☁️";
    }

    const WEAPONS = [
        { id: 0, name: "Wooden Sword", chance: 1/1, color: "#a6a6a6", power: 5 },
        { id: 1, name: "Iron Dagger", chance: 1/10, color: "#3498db", power: 25 },
        { id: 2, name: "Flame Katana", chance: 1/100, color: "#9b59b6", power: 150 },
        { id: 3, name: "Shadow Scythe", chance: 1/2500, color: "#f1c40f", power: 1200 },
        { id: 4, name: "Cosmic Blade", chance: 1/100000, color: "#ff9f43", power: 25000 },
        { id: 5, name: "Godslayer", chance: 1/10000000, color: "#ff4757", power: 1000000 }
    ];

    const PETS = [
        { name: "Slime Pet", chance: 1/1, color: "#2ecc71", power: 5 },
        { name: "Wolf Pet", chance: 1/20, color: "#e74c3c", power: 50 },
        { name: "Phoenix Mythic", chance: 1/100000, color: "#e84393", power: 30000 }
    ];

    let rolls = 0, coins = 100, gems = 0, luck = 0.1, luckCost = 2, inventory = {};
    let autoPackInterval = null, isRolling = false, autoType = "weapon";
    let autoFight = true;
    let currentWave = 1, maxUnlockedWave = 1, pwr = 10, mHp = 150, mMaxHp = 150;
    
    let player = { x: 60, y: 110, tx: 60, ty: 110, weaponId: 0, weaponColor: "#a6a6a6", attackAnim: 0 };
    let pet = { x: 30, y: 110, color: null, pwr: 0 };
    let monster = { x: 260, y: 110, r: 28, hit: 0, anim: 0, isBoss: false };
    let texts = [], lastAtk = 0;

    let saveTimeout = null;
    function saveGame() {
        if (!currentUser) return;
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveToCloud, 1200);
    }

    async function saveToCloud() {
        if (!supabaseClient || !currentUser) return;
        const saveData = JSON.stringify({ rolls, coins, gems, luck, luckCost, inventory, currentWave, maxUnlockedWave, pwr, playerWeaponId: player.weaponId, playerWeaponColor: player.weaponColor, petColor: pet.color, petPwr: pet.pwr });
        
        await supabaseClient.from('leaderboard').upsert([{ 
            user_id: currentUser.id,
            username: currentUsername || "Player",
            power: pwr, 
            wave: maxUnlockedWave,
            save_data: saveData 
        }], { onConflict: 'user_id' });
        document.getElementById('saveStatus').innerText = "Logged in: " + currentUsername + " ☁️";
    }

    function applySaveData(data) {
        rolls = data.rolls ?? rolls; coins = data.coins ?? coins; gems = data.gems ?? gems;
        luck = data.luck ?? luck; luckCost = data.luckCost ?? luckCost; inventory = data.inventory ?? inventory;
        currentWave = data.currentWave ?? currentWave; maxUnlockedWave = data.maxUnlockedWave ?? maxUnlockedWave;
        pwr = data.pwr ?? pwr; player.weaponId = data.playerWeaponId ?? player.weaponId;
        player.weaponColor = data.playerWeaponColor ?? player.weaponColor; pet.color = data.petColor ?? pet.color; pet.pwr = data.petPwr ?? pet.pwr;
        updateUI(); renderInv(); resetMonster();
    }

    function updateUI() {
        document.getElementById('rolls').innerText = rolls;
        document.getElementById('coins').innerText = coins;
        document.getElementById('gems').innerText = gems;
        document.getElementById('luck').innerText = luck.toFixed(2) + 'x';
        document.getElementById('luckCost').innerText = luckCost;
        document.getElementById('wave').innerText = currentWave + " / " + maxUnlockedWave;
        document.getElementById('pwr').innerText = pwr.toLocaleString();
    }

    function buyLuck() {
        if (gems >= luckCost) {
            gems -= luckCost; luck += 0.05; luckCost = Math.floor(luckCost * 2.5);
            updateUI(); saveGame();
        }
    }

    function changeWave(dir) {
        let target = currentWave + dir;
        if (target >= 1 && target <= maxUnlockedWave) {
            currentWave = target; resetMonster(); updateUI(); saveGame();
        }
    }

    function resetMonster() {
        monster.isBoss = (currentWave % 10 === 0);
        monster.r = monster.isBoss ? 36 : 24;
        mMaxHp = Math.floor((monster.isBoss ? 500 : 150) * Math.pow(1.45, currentWave - 1));
        mHp = mMaxHp;
    }

    function openPack(type) {
        let cost = type === 'weapon' ? 100 : 500;
        if (coins < cost || isRolling) return;
        coins -= cost; rolls++; isRolling = true; updateUI();

        let list = type === 'weapon' ? WEAPONS : PETS;
        let counter = 0;
        let anim = setInterval(() => {
            let temp = list[Math.floor(Math.random() * list.length)];
            document.getElementById('itemName').innerText = temp.name;
            document.getElementById('itemName').style.color = temp.color;
            if (++counter > 6) {
                clearInterval(anim);
                let rand = Math.random() / luck;
                let won = list[0];
                for (let i = list.length - 1; i >= 0; i--) {
                    if (rand <= list[i].chance) { won = list[i]; break; }
                }
                document.getElementById('itemName').innerText = won.name;
                document.getElementById('itemName').style.color = won.color;
                
                inventory[won.name] = { count: (inventory[won.name]?.count || 0) + 1, color: won.color, pwr: won.power };
                
                if (type === 'weapon' && won.power > (WEAPONS[player.weaponId]?.power || 0)) {
                    player.weaponId = won.id; player.weaponColor = won.color;
                }
                if (type === 'pet' && won.power > (pet.pwr || 0)) { pet.color = won.color; pet.pwr = won.power; }

                recalcPower(); renderInv(); isRolling = false; saveGame();
            }
        }, 50);
    }

    function recalcPower() {
        pwr = 10;
        for (let k in inventory) pwr += inventory[k].pwr * inventory[k].count;
        updateUI();
    }

    function toggleAutoPack() {
        if (autoPackInterval) { clearInterval(autoPackInterval); autoPackInterval = null; } 
        else { autoPackInterval = setInterval(() => { if (!isRolling) openPack(autoType); }, 500); }
    }

    function toggleAutoFight() {
        autoFight = !autoFight;
        let btn = document.getElementById('autoFightBtn');
        btn.innerText = "Auto Attack: " + (autoFight ? "ON" : "OFF");
        btn.style.background = autoFight ? "#2ed573" : "#747d8c";
    }

    function manualAttack() {
        player.attackAnim = 10;
        hitMonster(pwr);
    }

    function renderInv() {
        let el = document.getElementById('invList'); el.innerHTML = "";
        for (let k in inventory) {
            el.innerHTML += `<div class="inv-item"><span style="color:${inventory[k].color}">${k}</span><span>x${inventory[k].count}</span></div>`;
        }
    }

    async function fetchLeaderboard() {
        let listEl = document.getElementById('leaderboardList');
        if (!supabaseClient) return;

        try {
            const { data, error } = await supabaseClient
                .from('leaderboard')
                .select('username, power, wave')
                .order('power', { ascending: false })
                .limit(10);

            if (error || !data) return;

            listEl.innerHTML = "";
            data.forEach((row, index) => {
                let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `#${index+1}`;
                listEl.innerHTML += `
                    <div style="display: flex; background: #0d0e12; padding: 3px 6px; border-radius: 4px; justify-content: space-between;">
                        <span>${medal} <b>${row.username}</b></span>
                        <span style="color: var(--gold);">Pwr: ${Number(row.power).toLocaleString()}</span>
                    </div>
                `;
            });
        } catch(err) {}
    }

    function setupRealtime() {
        if (supabaseClient) {
            supabaseClient
                .channel('public:leaderboard')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'leaderboard' }, payload => {
                    fetchLeaderboard();
                })
                .subscribe();
        }
    }

    const cvs = document.getElementById('canvas'), ctx = cvs.getContext('2d');

    function hitMonster(dmg) {
        mHp -= dmg; monster.hit = 5;
        texts.push({ t: "-" + Math.round(dmg).toLocaleString(), x: monster.x + (Math.random()*30-15), y: monster.y - 25, a: 1.0 });

        if (mHp <= 0) {
            coins += currentWave * (monster.isBoss ? 250 : 80);
            if (currentWave % 2 === 0) gems += monster.isBoss ? 3 : 1;
            if (currentWave === maxUnlockedWave) { maxUnlockedWave++; currentWave++; }
            resetMonster(); updateUI(); saveGame();
        }
    }

    function drawPlayer(x, y) {
        ctx.fillStyle = "#70a1ff"; ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#1e90ff"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = "#2ed573"; ctx.fillRect(x - 4, y - 4, 10, 4);
        let slash = player.attackAnim > 0 ? (10 - player.attackAnim) * 0.2 : 0;
        ctx.save(); ctx.translate(x + 10, y); ctx.rotate(slash);
        ctx.fillStyle = player.weaponColor; ctx.fillRect(0, -3, 22, 6);
        ctx.fillStyle = "#fff"; ctx.fillRect(0, -1, 20, 2);
        ctx.restore();
    }

    function drawMonster(x, y, r, isBoss, hit) {
        ctx.save();
        ctx.fillStyle = hit > 0 ? "#ffffff" : (isBoss ? "#ff4757" : "#a55eea");
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            let a = (i / 8) * Math.PI * 2;
            let radius = i % 2 === 0 ? r : r * 0.75;
            let px = x + Math.cos(a) * radius;
            let py = y + Math.sin(a) * radius;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#2f3542"; ctx.lineWidth = 3; ctx.stroke();

        ctx.fillStyle = "#ff0000";
        ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.2, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + r*0.3, y - r*0.2, 4, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function loop(time) {
        ctx.clearRect(0, 0, cvs.width, cvs.height);

        if (autoFight) {
            player.tx = monster.x - 55; player.ty = monster.y;
            if (Math.hypot(monster.x - player.x, monster.y - player.y) < 70 && time - lastAtk > 400) {
                manualAttack();
                lastAtk = time;
            }
        } else {
            player.tx = 70; player.ty = 110;
        }

        player.x += (player.tx - player.x) * 0.1;
        player.y += (player.ty - player.y) * 0.1;
        if (player.attackAnim > 0) player.attackAnim--;

        pet.x += (player.x - 25 - pet.x) * 0.08;
        pet.y += (player.y + 12 - pet.y) * 0.08;

        if (pet.color) {
            ctx.fillStyle = pet.color; ctx.beginPath(); ctx.arc(pet.x, pet.y, 7, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(pet.x + 2, pet.y - 2, 2, 0, Math.PI*2); ctx.fill();
        }

        drawPlayer(player.x, player.y);
        monster.anim += 0.05; let bounce = Math.sin(monster.anim) * 4;
        drawMonster(monster.x, monster.y + bounce, monster.r, monster.isBoss, monster.hit);
        if (monster.hit > 0) monster.hit--;

        ctx.fillStyle = "#2f3542"; ctx.fillRect(monster.x-30, monster.y-monster.r-16+bounce, 60, 6);
        ctx.fillStyle = "#ff4757"; ctx.fillRect(monster.x-30, monster.y-monster.r-16+bounce, 60 * Math.max(0, mHp/mMaxHp), 6);

        for (let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i]; ctx.fillStyle = `rgba(255, 71, 87, ${t.a})`;
            ctx.font = "bold 13px sans-serif"; ctx.fillText(t.t, t.x, t.y);
            t.y -= 1; t.a -= 0.03; if (t.a <= 0) texts.splice(i, 1);
        }
        requestAnimationFrame(loop);
    }

    window.addEventListener('DOMContentLoaded', async () => {
        initSupabase();
        recalcPower(); renderInv(); resetMonster(); updateUI();
        fetchLeaderboard();
        requestAnimationFrame(loop);
    });
</script>
</body>
</html>
